name: ci

on:
  pull_request:
  push:
    branches: [master]
  # The nightly-only jobs below (scale, web-e2e) are gated on these two events, so a
  # pull request never pays for them. Everything else runs on all four, which
  # makes the nightly a genuine drift check against a moving toolchain.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: shellcheck ci scripts
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck && shellcheck ci/*.sh
      # Packaging is a build of its own: it strips dev-dependencies and then
      # verifies the tarball, which is how `src/bin/crash_child` needing a
      # dev-only feature was caught (trap 32). Catch that on every PR rather
      # than on publish day.
      - run: cargo publish --dry-run
      # The crate is not on crates.io yet, so there is no published baseline to
      # diff against — and cargo-semver-checks *errors* in that situation, it
      # does not pass. `continue-on-error` keeps that from turning `lint` red
      # and, through `ci-green`'s `needs`, the whole first push red. Remove
      # `continue-on-error` in the same commit that follows the first
      # `cargo publish`, which is when this step starts earning its keep.
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        continue-on-error: true

  # Cargo.toml declares `rust-version = "1.85"`, and nothing checked it until
  # this job existed. Pinned to the declared version on purpose: if the floor
  # has really moved, this lane says so instead of the manifest quietly
  # promising a toolchain that cannot build the crate.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      # --lib for trap 34: a bare `cargo check --workspace` builds
      # `src/bin/crash_child.rs`, which needs `futures`' `executor` feature
      # that only the dev-dependency turns on.
      - run: cargo check --workspace --lib --all-features

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-${{ matrix.os }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # nextest does not run doctests, so they get their own step.
      - run: cargo nextest run --workspace --all-features
      - run: cargo test --doc --workspace --all-features

  # Proves the crate compiles for every platform Flutter ships to.
  mobile-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          - os: macos-latest
            targets: aarch64-apple-ios aarch64-apple-ios-sim
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: mobile-${{ matrix.os }}
      - name: cargo check each target
        run: |
          for t in ${{ matrix.targets }}; do
            rustup target add "$t"
            echo "==> $t"
            # --lib because a bare `cargo check --workspace` also builds
            # `src/bin/crash_child.rs`, which needs `futures`' `executor`
            # feature that only the dev-dependency turns on (trap 32).
            cargo check --workspace --lib --target "$t" --all-features
          done

  wasm:
    strategy:
      fail-fast: false
      matrix:
        lane: [plain, atomics]
        browser: [chrome, firefox]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Select toolchain
        id: tc
        run: |
          if [ "${{ matrix.lane }}" = atomics ]; then
            echo "name=$(cat ci/wasm-toolchain.txt)" >> "$GITHUB_OUTPUT"
            echo "components=rust-src" >> "$GITHUB_OUTPUT"
          else
            echo "name=stable" >> "$GITHUB_OUTPUT"
            echo "components=" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.tc.outputs.name }}
          targets: wasm32-unknown-unknown
          components: ${{ steps.tc.outputs.components }}

      # The build-std lane compiles std into the target dir; giving it a
      # separate cache key stops it poisoning the stable lane's cache.
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-${{ matrix.lane }}-${{ matrix.browser }}

      # The runner must match the resolved wasm-bindgen version EXACTLY or it
      # aborts with a schema-version error. Derive it, never hand-pin it.
      - name: Resolve wasm-bindgen version
        id: wbg
        run: |
          # --no-deps is a flag, not a key=value. Passing --no-deps=false is a
          # hard error, which resolved this to an empty string and made the
          # install step ask for "wasm-bindgen-cli@". Resolve WITH deps, which
          # is the default, and refuse to continue on an empty result.
          v=$(cargo metadata --format-version 1 \
              | jq -r '.packages[] | select(.name=="wasm-bindgen") | .version' | head -1)
          if [ -z "$v" ]; then
            echo "FATAL: could not resolve a wasm-bindgen version" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "resolved wasm-bindgen $v"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.wbg.outputs.version }}

      # Use the runner image's preinstalled Chrome + chromedriver pair rather
      # than installing one. They ship together and are therefore
      # version-matched by construction. browser-actions/setup-chrome with
      # install-chromedriver pulled a dev chromedriver (153.0.8010.0) against
      # the image's stable Chrome and failed with "session not created: This
      # version of ChromeDriver only supports Chrome version 153".
      - name: Point at the runner's matched chromedriver
        if: matrix.browser == 'chrome'
        run: |
          test -n "${CHROMEWEBDRIVER:-}" || { echo "CHROMEWEBDRIVER unset on this image" >&2; exit 1; }
          echo "CHROMEDRIVER=${CHROMEWEBDRIVER}/chromedriver" >> "$GITHUB_ENV"
          "${CHROMEWEBDRIVER}/chromedriver" --version
          google-chrome --version

      # Pinned, not floating. `@v1` is a moving major tag and
      # `setup-geckodriver@latest` was a moving BRANCH — either could change
      # under us between two runs of the same commit. setup-geckodriver
      # publishes no version tags at all (its only tag is v0.0.0), so the SHA
      # of its `latest` branch is the only thing there is to pin.
      - uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
        if: matrix.browser == 'firefox'
      - uses: browser-actions/setup-geckodriver@fac5b0424c584257f32cf12c5eb4ba86014c34f8 # latest @ 2026-04-29
        if: matrix.browser == 'firefox'

      # Edge is Chromium: it shares Blink, V8, and the same IndexedDB
      # implementation, so the chrome lane covers it. A separate msedgedriver
      # lane would re-test the same engine.

      # ci/wasm-test.sh refuses to run if any RUSTFLAGS variable is exported,
      # checks the runner against Cargo.lock's wasm-bindgen, and asserts the
      # lane's expected test count from ci/expected-tests.txt so a skipped or
      # shrunken lane cannot report success.
      - run: ci/wasm-test.sh --${{ matrix.lane }} --${{ matrix.browser }}

  # Safari/WebKit. Separate job because it needs a macOS runner and there is
  # no Linux WebKit that shares Safari's IndexedDB implementation — the one
  # whose ITP evicts storage after 7 idle days.
  #
  # PLAIN LANE ONLY: there is no headless Safari, and SharedArrayBuffer under
  # a WebDriver-driven Safari is unreliable, so an atomics lane here would be
  # flaky rather than informative.
  #
  # Landing non-blocking (continue-on-error, and deliberately NOT in
  # ci-green's needs) until John has seen one green run. See PLAN.md.
  wasm-safari:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-plain-safari

      # safaridriver ships with macOS but its WebDriver support is off by
      # default; this is a one-liner on the runner and needs sudo.
      - name: Enable safaridriver
        run: sudo safaridriver --enable

      # The runner must match the resolved wasm-bindgen version EXACTLY or it
      # aborts with a schema-version error. Derive it, never hand-pin it.
      - name: Resolve wasm-bindgen version
        id: wbg
        run: |
          v=$(cargo metadata --format-version 1 \
              | jq -r '.packages[] | select(.name=="wasm-bindgen") | .version' | head -1)
          if [ -z "$v" ]; then
            echo "FATAL: could not resolve a wasm-bindgen version" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "resolved wasm-bindgen $v"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.wbg.outputs.version }}

      # --safari unsets CHROMEDRIVER/GECKODRIVER (the runner probes
      # geckodriver first) and asserts the same expected test count.
      - run: ci/wasm-test.sh --plain --safari

  # 100k keys, written and read back. Nightly only: it takes minutes, and it
  # asserts behaviour that only breaks at size rather than a duration, so it
  # has nothing to say about a given pull request. Release profile because a
  # debug build spends the whole run in the codec.
  scale:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: scale
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # Without CROSSBANK_SCALE=1 the test prints why it skipped and passes,
      # which is exactly what every other lane sees.
      - name: 100k keys
        env:
          CROSSBANK_SCALE: '1'
        run: cargo nextest run --release --all-features -E 'binary(scale)' --no-capture

  # A real page reload and two real tabs, on all three engines. Nightly only:
  # it needs Playwright browsers, which no other lane does, and it covers what
  # wasm_bindgen_test structurally cannot — that lane owns ONE page that never
  # navigates, so a fresh wasm instance reading an earlier one's bytes, and a
  # BroadcastChannel crossing between two documents, are both invisible to it.
  web-e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: web-e2e

      # The CLI must match Cargo.lock's wasm-bindgen EXACTLY; ci/web-e2e.sh
      # checks and says so, but resolve it here rather than hand-pinning it.
      - name: Resolve wasm-bindgen version
        id: wbg
        run: |
          v=$(cargo metadata --format-version 1 \
              | jq -r '.packages[] | select(.name=="wasm-bindgen") | .version' | head -1)
          if [ -z "$v" ]; then
            echo "FATAL: could not resolve a wasm-bindgen version" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.wbg.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browsers
        run: npx --yes playwright install --with-deps chromium firefox webkit

      # Every engine, and every engine must pass: this is the only lane where
      # a real reload is tested at all, so a browser skipped here is a browser
      # nothing covers.
      - name: chromium
        run: ci/web-e2e.sh --browser chromium
      - name: firefox
        run: ci/web-e2e.sh --browser firefox
      - name: webkit
        run: ci/web-e2e.sh --browser webkit

  # Single required status check for branch protection.
  ci-green:
    if: always()
    needs: [lint, msrv, native, mobile-check, wasm]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job did not succeed
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs) }}' | jq -e 'to_entries[] | select(.value.result != "success")' > /dev/null; then
            echo "one or more jobs failed"
            exit 1
          fi
          echo "all jobs succeeded"
