[package]
name = "crossbank"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Cross-platform persistent key/value storage for Rust — one API on native and in the browser."
repository = "https://github.com/john-says-hi/crossbank"
readme = "README.md"
keywords = ["storage", "key-value", "wasm", "indexeddb", "embedded"]
categories = ["database-implementations", "wasm"]
# Flipped on at M6. Guards against an accidental early publish.
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
# Compact and stable, but deliberately NOT self-describing — which is why a
# locker records a schema tag.
postcard = { version = "1", features = ["use-std"] }
lz4_flex = "0.14"
crc32fast = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# M0 spike: the candidate native backend. Pure Rust, ACID, and it must build
# for every platform Flutter ships to.
redb = "4.1"

[dev-dependencies]
# Test-only executor. crossbank itself never depends on an async runtime —
# `futures::executor::block_on` needs no Send bounds, which is what lets the
# same conformance cases run natively and under wasm_bindgen_test.
futures = "0.3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "console"] }
# M0 spike: the candidate web backend. Chosen over `indexed_db_futures`
# because that crate pulls tokio in for one of its features, and crossbank
# must never depend on an async runtime.
indexed-db = "0.4.2"
