[workspace]
members = [".", "crossbank-conformance"]

[package]
name = "crossbank"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Local, on-device key/value storage for Rust — one API on native (redb) and in the browser (IndexedDB). A Hive-shaped replacement, with no network, server, or sync."
repository = "https://github.com/john-says-hi/crossbank"
readme = "README.md"
documentation = "https://docs.rs/crossbank"
keywords = ["storage", "key-value", "wasm", "indexeddb", "embedded"]
categories = ["database-implementations", "wasm"]
# Everything a consumer of the published crate cannot use: browser bench
# harnesses, CI plumbing, and the end-to-end page. The lib, its tests, its
# examples and both licences still ship.
#
# `src/bin/` is here for a different reason: `crash_child` is the process the
# crash-recovery tests abort on purpose, and it needs `futures`' executor
# feature, which only the dev-dependency turns on. Publishing strips
# dev-dependencies, so the packaged bin would not compile — and nobody
# installing crossbank wants a binary whose whole job is to die.
# `src/bin/` and `tests/crash_recovery.rs` are a PAIR and must be excluded
# together. The test launches the helper binary through
# `env!("CARGO_BIN_EXE_crash_child")`, so shipping the test without the binary
# leaves the packaged crate unable to even compile its test suite; shipping the
# binary without dev-dependencies fails `cargo publish --dry-run` (it needs
# `futures`' `executor` feature, which only the dev-dependency turns on).
exclude = [
    "bench/",
    "ci/",
    ".github/",
    "tests/web_e2e/",
    "src/bin/",
    "tests/crash_recovery.rs",
    # Same wall, different helper: these three are nothing but a call into the
    # `crossbank-conformance` macro, and that crate is a path dev-dependency
    # that publishing strips. Shipping them leaves the packaged crate unable to
    # compile its own test suite. The suite still runs from this repo, which is
    # the only place the harness exists.
    "tests/conformance_memory.rs",
    "tests/conformance_redb.rs",
    "tests/conformance_indexeddb.rs",
]

[features]
# Opt-in, and OFF everywhere by default. Its only job is to compile the wasm
# half of tests/scale.rs into a lane, which the nightly scale job does
# explicitly. It must stay a feature rather than an env var: `cfg` cannot read
# one without a build script, and `RUSTFLAGS --cfg` is forbidden (see
# ci/guard-rustflags.sh).
scale = []

[dependencies]
serde = { version = "1", features = ["derive"] }
# Compact and stable, but deliberately NOT self-describing — which is why a
# locker records a schema tag.
postcard = { version = "1", features = ["use-std"] }
lz4_flex = "0.14"
crc32fast = "1"
# For `futures::lock::Mutex` and, later, channels. Explicitly NOT an async
# runtime: crossbank spawns nothing and leaves execution to the caller.
futures = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# M0 spike: the candidate native backend. Pure Rust, ACID, and it must build
# for every platform Flutter ships to.
redb = "4.1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"
criterion = "0.5"

[[bench]]
name = "kv"
harness = false

[dev-dependencies]
# The shared spec. Cargo permits a dev-dependency cycle, which is what lets the
# suite live in its own crate while still being run from crossbank's tests.
crossbank-conformance = { path = "crossbank-conformance" }
# Test-only executor. crossbank itself never depends on an async runtime —
# `futures::executor::block_on` needs no Send bounds, which is what lets the
# same conformance cases run natively and under wasm_bindgen_test.
futures = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Navigator",
    "StorageManager",
    "StorageEstimate",
    "BroadcastChannel",
    "MessageEvent",
    "console",
] }
# Chosen over `indexed_db_futures` because that crate pulls tokio in for one
# of its features, and crossbank must never depend on an async runtime.
# 0.5.0 is yanked; 0.4.2 is the newest usable release.
indexed-db = "0.4.2"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
