[package]
name = "crossbank-conformance"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "The shared behavioural spec every crossbank backend must satisfy."
repository = "https://github.com/john-says-hi/crossbank"
publish = false

[dependencies]
crossbank = { path = ".." }
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-test = "0.3"
